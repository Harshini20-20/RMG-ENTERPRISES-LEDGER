<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMG ENTERPRISES | {{PORTAL}} Login</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-bg"><main class="login-card"><div class="logo">RMG</div><p class="eyebrow">RETAILER LEDGER MANAGEMENT</p><h1>RMG ENTERPRISES</h1><p class="muted">{{PORTAL}} Portal</p><form id="f"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in to {{PORTAL}}</button><p id="msg" class="error"></p></form><p class="switch"><a href="{{OTHER_URL}}">Go to {{OTHER}} Login</a></p><footer><b>Powered by Harshini</b><br><a href="mailto:harshinigundger234@gmail.com">Inquiries: harshinigundger234@gmail.com</a></footer></main><script>const role="{{ROLE}}";document.querySelector("#f").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch("/api/login?role="+role,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),password:f.get("password")})});const d=await r.json();if(!r.ok){document.querySelector("#msg").textContent=d.detail||"Login failed";return}location.href=d.redirect}</script></body></html>
